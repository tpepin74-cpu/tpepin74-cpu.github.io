name: La Bonne Auberge - verification publique
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bonne-auberge-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: bonne-auberge
      - name: Verifier les pages et les photographies publiees
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, os, time, urllib.parse, urllib.request
          from pathlib import Path
          base = 'https://tpepin74-cpu.github.io/bonne-auberge/'
          root = Path('bonne-auberge')
          paths = sorted(p for p in root.rglob('*') if p.is_file() and not p.name.startswith('.') and p.name != 'README.md')
          def verify(path):
              relative = path.relative_to(root).as_posix()
              url = base + urllib.parse.quote(relative)
              expected = hashlib.sha256(path.read_bytes()).hexdigest()
              last_error = None
              for attempt in range(8):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent':'La-Bonne-Auberge-Public-Check/1.0', 'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = response.read(2_000_000)
                          if response.status != 200:
                              raise ValueError('HTTP ' + str(response.status))
                      if hashlib.sha256(body).hexdigest() != expected:
                          raise ValueError('Contenu public different du fichier publie')
                      return relative, len(body)
                  except Exception as error:
                      last_error = error
                      time.sleep(3)
              raise RuntimeError(relative + ': ' + str(last_error))
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as executor:
              results = list(executor.map(verify, paths))
          for relative, size in results:
              print('HTTP 200 - contenu conforme - ' + relative + ' (' + str(size) + ' octets)')
          for url in ['https://tpepin74-cpu.github.io/', 'https://tpepin74-cpu.github.io/snuug/']:
              with urllib.request.urlopen(url, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError('Site existant non accessible: ' + url)
                  print('Site existant accessible: ' + url)
          count = sum(name.endswith('.avif') for name, _ in results)
          print('VERIFICATION REUSSIE:', len(results), 'fichiers publics dont', count, 'photographies.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Publication verifiee\n\n' + base + '\n\n' + str(len(results)) + ' fichiers verifies par HTTP 200 et empreinte SHA-256, dont ' + str(count) + ' photographies.\n\nAccueil et Snuug existants accessibles.\n')
          PY
