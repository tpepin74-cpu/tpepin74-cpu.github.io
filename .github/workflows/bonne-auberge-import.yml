name: La Bonne Auberge - import automatique
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bonne-auberge-import.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: bonne-auberge-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer le lecteur de transfert sans perte
        run: python -m pip install --quiet --disable-pip-version-check Pillow
      - name: Recuperer et controler le site prepare
        env:
          TRANSFER_IMAGE_URI: 'https://docs.google.com/docs-images-rt/AIpPl2C2nMBAWeYQU7okyP_bUS7KDiwgjh0Qeu-prkAL0vYDWgQIAKePnP6BKu7gHtJgWOwR9VQnmYTURSYGS1evFt5vR7nj4zxW8-ij5tj03xvDiDm--99gZawRpoaytG6B4XwmoXX498SGbdUWYs2aWVcxxSurpcGWG3TbzUS9TFW1_3HnuyA=s2048?key=jQJ7kjWNmFZZZYsBQHWACw'
        run: |
          python - <<'PY'
          import hashlib, io, os, stat, struct, urllib.request, zipfile
          from pathlib import Path, PurePosixPath
          from PIL import Image
          expected = '837f3179cf0eaad1dea42724b8c57c031f0429cfc011c1789cde1b759bc23469'
          request = urllib.request.Request(os.environ['TRANSFER_IMAGE_URI'], headers={'User-Agent': 'La-Bonne-Auberge-Deployment/1.0'})
          with urllib.request.urlopen(request, timeout=60) as response:
              transferred = response.read(4_000_001)
          if len(transferred) > 4_000_000:
              raise SystemExit('Transfert trop volumineux.')
          image = Image.open(io.BytesIO(transferred))
          if image.size != (1024, 481):
              raise SystemExit('Dimensions de transfert inattendues: ' + str(image.size))
          decoded = image.convert('RGB').tobytes()
          if decoded[:8] != b'BAZIP001':
              raise SystemExit('En-tete de transfert invalide.')
          size = struct.unpack('>Q', decoded[8:16])[0]
          if size != 1476997:
              raise SystemExit('Taille archive invalide.')
          archive = decoded[16:16+size]
          if hashlib.sha256(archive).hexdigest() != expected:
              raise SystemExit('Empreinte archive invalide. Aucun fichier modifie.')
          destination = Path('bonne-auberge')
          with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
              entries = bundle.infolist()
              if len(entries) != 85 or sum(e.file_size for e in entries) != 1978500:
                  raise SystemExit('Structure archive inattendue.')
              names = set()
              for entry in entries:
                  path = PurePosixPath(entry.filename)
                  if path.is_absolute() or '..' in path.parts or not path.parts or path.parts[0] != 'bonne-auberge' or '\\' in entry.filename:
                      raise SystemExit('Chemin refuse.')
                  if stat.S_ISLNK(entry.external_attr >> 16) or entry.filename in names:
                      raise SystemExit('Lien symbolique ou doublon refuse.')
                  names.add(entry.filename)
              if destination.exists():
                  for entry in entries:
                      target = Path(entry.filename)
                      if not entry.is_dir() and (not target.is_file() or target.read_bytes() != bundle.read(entry)):
                          raise SystemExit('Un site different existe deja. Aucun remplacement automatique.')
              else:
                  bundle.extractall('.')
          required = ['index.html', 'restaurant.html', 'epicerie.html', 'chambres.html', 'assets/site.js', 'assets/site-data.js', 'assets/site.css', 'assets/logo-bonne-auberge.svg']
          for name in required:
              if not (destination / name).is_file():
                  raise SystemExit('Fichier manquant: ' + name)
          images = list((destination / 'assets/images').glob('*.avif'))
          if len(images) != 54:
              raise SystemExit('Nombre de photographies inattendu.')
          for photo in images:
              with Image.open(photo) as image:
                  image.verify()
          print('Archive verifiee: 85 fichiers, 54 photographies, SHA-256 conforme. Les autres sites sont preserves.')
          PY
          node --check bonne-auberge/assets/site.js
          node --check bonne-auberge/assets/site-data.js
      - name: Enregistrer le site et supprimer le transfert temporaire
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bonne-auberge
          git rm -- .github/workflows/bonne-auberge-import.yml
          git diff --cached --name-only | while IFS= read -r path; do
            case "$path" in
              bonne-auberge/*|.github/workflows/bonne-auberge-import.yml) ;;
              *) echo "Modification hors perimetre: $path"; exit 1 ;;
            esac
          done
          git commit -m 'Publish La Bonne Auberge optimized V12 and remove temporary import'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 2
          done
      - name: Preparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Inclure tous les sites existants
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirmer la publication
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf '## La Bonne Auberge\n\n%sbonne-auberge/\n\nSite optimise V12 importe et publie. 54 photographies. Boutique de demonstration.\n' "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
