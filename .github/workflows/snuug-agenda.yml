name: SNUUG agenda
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: snuug-agenda
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh agenda (preserve data when source unavailable)
        id: agenda
        continue-on-error: true
        run: node snuug/source/refresh-agenda.mjs
      - name: Commit agenda only
        run: |
          if ! git diff --quiet -- snuug/agenda.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- snuug/agenda.json
            git commit -m 'Refresh SNUUG agenda'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy existing sites and SNUUG
        id: deployment
        uses: actions/deploy-pages@v4
